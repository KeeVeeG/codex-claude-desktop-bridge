<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude — conversations</title>
  <style>
    :root {
      color-scheme: dark;
      --fallback-background-primary: #181818;
      --fallback-background-secondary: #303030;
      --fallback-background-tertiary: #1b1b1b;
      --fallback-composer: #333333;
      --fallback-text-primary: #ffffff;
      --fallback-text-secondary: #a0a0a0;
      --fallback-text-tertiary: #9a9a9a;
      --fallback-border: #292929;
      --bg: var(--color-background-primary, var(--fallback-background-primary));
      --sidebar: var(--color-background-tertiary, var(--fallback-background-tertiary));
      --surface: var(--color-background-secondary, var(--fallback-background-secondary));
      --composer: var(--color-background-secondary, var(--fallback-composer));
      --text: var(--color-text-primary, var(--fallback-text-primary));
      --muted: var(--color-text-secondary, var(--fallback-text-secondary));
      --quiet: var(--color-text-tertiary, var(--fallback-text-tertiary));
      --line: var(--color-border-secondary, var(--fallback-border));
      --ring: var(--color-ring-primary, var(--text));
      --danger: var(--color-text-danger, var(--text));
      --warning: var(--color-text-warning, var(--muted));
      font-family: var(--font-sans, system-ui, -apple-system, "Segoe UI", sans-serif);
      font-size: var(--font-text-sm-size, 14px); line-height: var(--font-text-sm-line-height, 1.5); font-weight: var(--font-weight-normal, 400);
    }
    :root[data-theme=light] {
      color-scheme: light;
      --fallback-background-primary: #ffffff;
      --fallback-background-secondary: #eeeeee;
      --fallback-background-tertiary: #f7f7f7;
      --fallback-composer: #f0f0f0;
      --fallback-text-primary: #202020;
      --fallback-text-secondary: #656565;
      --fallback-text-tertiary: #6b6b6b;
      --fallback-border: #e7e7e7;
    }
    * { box-sizing: border-box }
    body { margin: 0; background: var(--bg); color: var(--text) }
    button, input, textarea { font: inherit; color: inherit }
    button { cursor: pointer; -webkit-tap-highlight-color: transparent }
    button:disabled { cursor: default; opacity: .45 }
    button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--ring); outline-offset: 3px }
    svg { display: block; width: 17px; height: 17px; flex: none }
    button svg { pointer-events: none }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap }
    [hidden] { display: none !important }
    .shell { height: 100dvh; min-height: 360px; display: flex; flex-direction: column; overflow: hidden }
    .topbar { height: 48px; flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px; border-bottom: 1px solid var(--line); background: var(--bg) }
    .brand-name { font-size: 14px; font-weight: var(--font-weight-semibold, 600) }
    .toolbar { display: flex; align-items: center; gap: 3px }
    .icon-button { width: 34px; height: 34px; display: grid; place-items: center; background: transparent; border: 0; border-radius: 7px; color: var(--muted) }
    .icon-button:hover { background: var(--surface); color: var(--text) }
    .demo-banner { padding: 6px 16px; border-bottom: 1px solid var(--line); font-size: 11px; color: var(--muted) }
    .demo-banner strong { font-weight: var(--font-weight-medium, 550); margin-right: 6px; color: var(--text) }
    .main { display: grid; grid-template-columns: minmax(220px, 31%) minmax(0, 1fr); flex: 1; min-height: 0 }
    .sidebar { min-height: 0; display: flex; flex-direction: column; border-right: 1px solid var(--line); background: var(--sidebar) }
    .sidebar-head { padding: 16px 14px 12px }
    .heading-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px }
    .heading-row h1 { font-size: 12px; font-weight: var(--font-weight-medium, 500); color: var(--muted); margin: 0 }
    .count { font-size: 11px; color: var(--quiet) }
    .search-wrap { position: relative }
    .search-wrap svg { position: absolute; left: 9px; top: 9px; width: 15px; height: 15px; color: var(--quiet) }
    .search { height: 36px; width: 100%; border: 1px solid var(--line); border-radius: 7px; background: transparent; padding: 5px 8px 5px 30px; color: var(--text); font-size: 12px }
    .search::placeholder { color: var(--quiet) }
    .tabs { display: flex; gap: 15px; padding: 0 15px 7px; border-bottom: 1px solid var(--line) }
    .tab { min-height: 32px; padding: 5px 0; border: 0; border-radius: 0; background: transparent; color: var(--muted); font-size: 12px; font-weight: var(--font-weight-normal, 400) }
    .tab[aria-selected=true] { color: var(--text) }
    .chat-list { padding: 7px; flex: 1; overflow: auto; min-height: 0 }
    .chat { width: 100%; display: block; padding: 10px 9px; margin-bottom: 2px; text-align: left; border: 0; border-radius: 7px; background: transparent }
    .chat:hover, .chat[aria-current=true] { background: var(--surface) }
    .chat-info { display: block; min-width: 0 }
    .chat-top { display: flex; align-items: baseline; gap: 7px }
    .chat-title { font-size: 13px; font-weight: var(--font-weight-normal, 400); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
    .chat-time { font-size: 10px; color: var(--quiet); white-space: nowrap; font-variant-numeric: tabular-nums }
    .chat-cwd { display: block; margin-top: 4px; font-size: 11px; color: var(--quiet); overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
    .sidebar-foot { display: none }
    .list-empty { padding: 27px 9px; color: var(--muted); font-size: 12px; line-height: 1.6 }
    .list-empty strong { display: block; color: var(--text); font-weight: var(--font-weight-normal, 400); margin-bottom: 4px }
    .conversation { display: flex; flex-direction: column; min-width: 0; min-height: 0; background: var(--bg) }
    .conversation-head { min-height: 57px; padding: 11px 20px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 9px; flex: none }
    .conversation-heading { flex: 1; min-width: 0 }
    .conversation-title { font-size: 13px; line-height: 1.4; font-weight: var(--font-weight-medium, 500); margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
    .conversation-subtitle { font-size: 11px; color: var(--quiet); margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
    .mobile-back { display: none }
    .welcome { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 30px; color: var(--muted) }
    .welcome h2 { font-size: 15px; color: var(--text); font-weight: var(--font-weight-normal, 400); margin: 0 0 9px }
    .welcome p { font-size: 13px; line-height: 1.7; max-width: 290px; margin: 0 }
    .timeline { flex: 1; min-height: 0; overflow: auto; padding: 18px 23px 24px; scroll-behavior: auto }
    .history-control { display: flex; justify-content: center; margin-bottom: 16px }
    .small-button { min-height: 30px; font-size: 11px; padding: 5px 8px; border: 0; border-radius: 6px; background: transparent; color: var(--muted) }
    .small-button:hover { background: var(--surface); color: var(--text) }
    .day { margin: 14px 0 24px; color: var(--quiet); font-size: 11px; text-align: center }
    .message-row { display: flex; flex-direction: column; align-items: flex-start; margin-bottom: 27px }
    .message-row.outgoing { align-items: flex-end }
    .message-label { color: var(--muted); font-size: 11px; display: flex; align-items: center; gap: 6px; margin: 0 0 7px }
    .manual-tag { font-size: 10px; color: var(--quiet) }
    .bubble { width: 100%; min-width: 0; padding: 0; background: transparent; border: 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: var(--font-text-md-size, 14px); line-height: var(--font-text-md-line-height, 1.7) }
    .outgoing .bubble { width: auto; max-width: min(88%, 580px); padding: 12px 15px; border-radius: 16px; background: var(--surface) }
    .message-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 7px; margin-top: 7px; color: var(--quiet); font-size: 10px; font-variant-numeric: tabular-nums }
    .message-meta.warning { color: var(--warning) }
    .message-meta.failed { color: var(--danger) }
    .notice-detail { display: block; margin-top: 5px; color: var(--muted); font-size: 10px; text-align: right; max-width: 88% }
    .timeline-empty { margin: 44px 0; color: var(--muted); font-size: 13px; line-height: 1.7; max-width: 340px }
    .timeline-empty strong { display: block; margin-bottom: 5px; color: var(--text); font-weight: var(--font-weight-normal, 400) }
    .alert { display: flex; align-items: flex-start; gap: 10px; margin: 0 18px 12px; padding: 10px 11px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); font-size: 12px; flex: none }
    .alert.error { color: var(--danger) }
    .alert-text { flex: 1; min-width: 0 }
    .alert button { border: 0; background: transparent; color: inherit; text-decoration: underline; padding: 0; font-size: 11px; white-space: nowrap }
    .composer-wrap { padding: 0 16px 12px; flex: none }
    .composer { padding: 13px 14px 10px; background: var(--composer); border: 1px solid var(--color-border-tertiary, var(--line)); border-radius: 21px; box-shadow: 0 1px 2px rgb(0 0 0 / 8%) }
    .composer:focus-within { outline: 2px solid var(--ring); outline-offset: 2px }
    .composer textarea { display: block; width: 100%; min-height: 44px; max-height: 140px; padding: 2px 1px 7px; border: 0; outline: 0; background: transparent; resize: none; overflow-y: hidden; color: var(--text); font-size: var(--font-text-md-size, 14px); line-height: var(--font-text-md-line-height, 1.55) }
    .composer textarea::placeholder { color: var(--quiet) }
    .composer textarea:focus-visible { outline: 0 }
    .composer-bottom { display: flex; justify-content: flex-end; align-items: center; min-height: 32px; margin-top: 2px }
    .send-button { display: grid; place-items: center; flex: 0 0 32px; aspect-ratio: 1 / 1; width: 32px; min-width: 32px; max-width: 32px; height: 32px; min-height: 32px; max-height: 32px; align-self: flex-end; padding: 0; appearance: none; background: var(--text); color: var(--bg); border: 0; border-radius: 50% }
    .send-button:hover:not(:disabled) { background: var(--color-background-info, var(--text)); color: var(--color-text-inverse, var(--bg)) }
    .send-button svg { width: 16px; height: 16px }
    .composer-note { display: none; font-size: 10px; color: var(--quiet); margin: 7px 2px 0 }
    .composer-inactive { padding: 12px 0; font-size: 12px; line-height: 1.7; color: var(--muted) }
    .composer-inactive strong { display: block; color: var(--text); font-weight: var(--font-weight-normal, 400); margin-bottom: 3px }
    .connection-error { padding: 12px 16px; border-bottom: 1px solid var(--line); color: var(--danger); font-size: 12px }
    .spin svg { animation: spin 1s linear infinite }
    @keyframes spin { to { transform: rotate(360deg) } }
    @media(prefers-reduced-motion:reduce) { .spin svg { animation: none } }
    @media(min-width:1150px) { .main { grid-template-columns: 280px minmax(0,1fr) } .timeline { padding-left: 6%; padding-right: 6% } .composer-wrap { padding-left: 6%; padding-right: 6% } .alert { margin-left: 6%; margin-right: 6% } }
    @media(max-width:620px) { .topbar { padding: 0 13px; height: 45px } .main { grid-template-columns: 1fr } .sidebar { border-right: 0 } .conversation { display: none } .shell.has-selection .sidebar { display: none } .shell.has-selection .conversation { display: flex } .mobile-back { display: grid } .conversation-head { padding: 10px 13px } .timeline { padding: 16px 16px 21px } .outgoing .bubble { max-width: 91% } .composer-wrap { padding: 0 12px 12px } .alert { margin: 0 12px 10px } .welcome { display: none } .demo-banner { padding: 6px 13px; font-size: 10px } }
    @media(max-width:420px) { .send-button { flex-basis: 32px; width: 32px; min-width: 32px; max-width: 32px; height: 32px; min-height: 32px; max-height: 32px } }
  </style>
</head>
<body>
  <div class="shell" id="shell">
    <header class="topbar">
      <div class="brand-name">Claude</div>
      <div class="toolbar"><span class="sr-only" id="connection-label" role="status">Connecting…</span><button class="icon-button" id="focus-search" type="button" aria-label="Search chats" title="Search chats"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg></button><button class="icon-button" id="refresh" type="button" aria-label="Refresh chats and history" title="Refresh"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 8a8 8 0 1 0 .4 7M20 3v5h-5"/></svg></button></div>
    </header>
    <div class="demo-banner" id="demo-banner" hidden><strong>Demo</strong>Demo interface. No real messages are sent.</div>
    <div class="connection-error" id="connection-error" role="alert" hidden></div>
    <div class="main">
      <aside class="sidebar" aria-label="Conversation list">
        <div class="sidebar-head"><div class="heading-row"><h1>Conversations</h1><span class="count" id="chat-count">—</span></div><div class="search-wrap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4 4"/></svg><label class="sr-only" for="search">Search by chat or project name</label><input class="search" id="search" type="search" placeholder="Search chats or projects" autocomplete="off"></div></div>
        <div class="tabs" role="tablist" aria-label="Show chats"><button class="tab" id="tab-contacted" role="tab" aria-selected="true" aria-controls="chat-list" type="button">Conversations</button><button class="tab" id="tab-all" role="tab" aria-selected="false" aria-controls="chat-list" type="button" tabindex="-1">All chats</button></div>
        <div class="chat-list" id="chat-list" role="tabpanel" aria-label="Claude chats"></div>
        <div class="sidebar-foot"><span class="foot-dot" aria-hidden="true"></span><span id="sidebar-note">Local Desktop chats</span></div>
      </aside>
      <main class="conversation" aria-label="Conversation">
        <div class="conversation-head" id="conversation-head" hidden><button class="icon-button mobile-back" id="back" type="button" aria-label="Back to chat list"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m14 6-6 6 6 6"/></svg></button><div class="conversation-heading"><h2 class="conversation-title" id="conversation-title"></h2><div class="conversation-subtitle" id="conversation-subtitle"></div></div></div>
        <div class="welcome" id="welcome"><h2>Select a Claude chat</h2><p>Messages and the reply box will appear here.</p></div>
        <div class="timeline" id="timeline" aria-label="Message history" hidden></div>
        <div class="alert" id="conversation-alert" role="status" hidden><span class="alert-text" id="alert-text"></span><button type="button" id="alert-refresh">Refresh</button></div>
        <div class="composer-wrap" id="composer-wrap" hidden><div class="composer-inactive" id="composer-inactive" hidden><strong id="inactive-title"></strong><span id="inactive-detail"></span></div><form class="composer" id="composer"><label class="sr-only" for="message">Message for the selected Claude chat</label><textarea id="message" aria-describedby="composer-hint" rows="1" placeholder="Write to Claude…" maxlength="65536"></textarea><span class="sr-only" id="composer-hint">Enter — send · Shift+Enter — new line</span><div class="composer-bottom"><button class="send-button" id="send" type="submit"><span class="sr-only" id="send-label">Send</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5m-5 5 5-5 5 5"/></svg></button></div></form><p class="composer-note" id="composer-note">Accepted by the local transport; read receipts are unavailable.</p></div>
      </main>
    </div>
    <div class="sr-only" id="announcement" aria-live="polite"></div>
  </div>
  <script type="module">
  const $ = id => document.getElementById(id);
  const demo = location.hash === '#demo';
  const state = { chats: [], selected: null, tab: 'contacted', query: '', owner: null, ready: false,
    drafts: new Map(), histories: new Map(), sends: new Map(), panelError: '', refreshing: false };
  const noticeRetries = new Set();
  const rpcPending = new Map();
  let rpcId = 0;
  let hostOrigin = null;
  let initializeId = null;
  let initialLoad = false;
  let initialPanelResult = null;
  // Codex's native composer sends on Enter and inserts a newline with
  // Shift+Enter. Hosts may override this through hostContext when exposed.
  let composerEnterBehavior = 'enter';
  const initialPanelWaiters = [];
  const object = value => value !== null && typeof value === 'object' && !Array.isArray(value);
  const string = value => typeof value === 'string' ? value : '';
  const timestamp = value => { const date = new Date(value); return Number.isFinite(date.getTime()) && date.getTime() > 0 ? date.getTime() : 0; };
  const targetOrigin = () => hostOrigin && hostOrigin !== 'null' ? hostOrigin : '*';
  const shortTime = value => timestamp(value) ? new Date(timestamp(value)).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' }) : '';
  const shortDate = value => timestamp(value) ? new Date(timestamp(value)).toLocaleDateString('en-US', { day: '2-digit', month: '2-digit' }) : '';
  const workspace = cwd => string(cwd).split(/[\\/]/).filter(Boolean).slice(-2).join(' / ');
  function element(tag, className, text) { const node = document.createElement(tag); if (className) node.className = className; if (text !== undefined) node.textContent = text; return node; }
  function announce(text) { $('announcement').textContent = text; }
  function theme(context) {
    if (!object(context)) return;
    if (context.theme === 'dark' || context.theme === 'light') document.documentElement.dataset.theme = context.theme;
    const variables = context.styles?.variables;
    if (object(variables)) for (const [name, value] of Object.entries(variables)) {
      if (/^--[a-zA-Z0-9_-]+$/.test(name) && typeof value === 'string') document.documentElement.style.setProperty(name, value);
    }
  }
  function composerContext(context) {
    if (!object(context)) return;
    const value = context.composer_enter_behavior ?? context.composer?.enterBehavior ?? context['codex/composer']?.enterBehavior ?? context['openai/composer']?.enterBehavior;
    if (['enter', 'cmdIfMultiline', 'cmdAlways'].includes(value)) composerEnterBehavior = value;
    else if (value === 'send') composerEnterBehavior = 'enter';
    else if (value === 'newline') composerEnterBehavior = 'cmdAlways';
  }
  function resizeComposer() {
    const input = $('message'); if (!input) return;
    input.style.height = 'auto';
    const height = Math.min(input.scrollHeight || 46, 140);
    input.style.height = `${height}px`;
    input.style.overflowY = (input.scrollHeight || 0) > 140 ? 'auto' : 'hidden';
  }
  function rpc(method, params) {
    if (!hostOrigin && method !== 'ui/initialize') return Promise.reject(new Error('Desktop connection is not established yet.'));
    const id = ++rpcId;
    if (method === 'ui/initialize') initializeId = id;
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => { rpcPending.delete(id); reject(new Error('Desktop did not respond in time. Refresh the panel.')); }, 25000);
      rpcPending.set(id, { resolve, reject, timer, method });
      window.parent.postMessage({ jsonrpc: '2.0', id, method, params }, targetOrigin());
    });
  }
  function notify(method, params) { window.parent.postMessage({ jsonrpc: '2.0', method, params }, targetOrigin()); }
  function waitForInitialPanel() {
    if (initialPanelResult) return Promise.resolve(initialPanelResult);
    return new Promise(resolve => {
      const timer = setTimeout(() => {
        const index = initialPanelWaiters.findIndex(waiter => waiter.resolve === resolve);
        if (index >= 0) initialPanelWaiters.splice(index, 1);
        resolve(null);
      }, 250);
      initialPanelWaiters.push({ resolve, timer });
    });
  }
  function receiveInitialPanel(data) {
    if (!initialPanelResult) initialPanelResult = data;
    while (initialPanelWaiters.length) {
      const waiter = initialPanelWaiters.shift(); clearTimeout(waiter.timer); waiter.resolve(initialPanelResult);
    }
  }
  function mcpData(result) {
    if (!object(result)) throw new Error('Desktop returned an invalid response format.');
    if (result.isError) {
      const detail = Array.isArray(result.content) ? result.content.filter(item => item?.type === 'text').map(item => string(item.text)).join('\n') : '';
      throw new Error(detail.slice(0, 1200) || 'Action could not be completed.');
    }
    if (object(result.structuredContent)) return result.structuredContent;
    if (Array.isArray(result.content)) for (const item of result.content) if (item?.type === 'text') {
      try { const value = JSON.parse(item.text); if (object(value)) return value; } catch {}
    }
    throw new Error('Desktop returned an invalid response format.');
  }
  async function call(name, args = {}) {
    if (demo) return demoCall(name, args);
    return mcpData(await rpc('tools/call', { name, arguments: args }));
  }
  window.addEventListener('message', event => {
    if (event.source !== window.parent || !object(event.data) || event.data.jsonrpc !== '2.0') return;
    const message = event.data;
    if (hostOrigin !== null && event.origin !== hostOrigin) return;
    if (Object.hasOwn(message, 'id') && rpcPending.has(message.id)) {
      const pending = rpcPending.get(message.id);
      if (hostOrigin === null) {
        if (message.id !== initializeId || typeof event.origin !== 'string') return;
        if (!object(message.error) && (!object(message.result) || message.result.protocolVersion !== '2026-01-26')) {
          clearTimeout(pending.timer); rpcPending.delete(message.id);
          pending.reject(new Error('Desktop did not negotiate a supported UI version. Update the app and reopen the panel.'));
          return;
        }
        hostOrigin = event.origin;
      }
      clearTimeout(pending.timer); rpcPending.delete(message.id);
      if (message.error) pending.reject(new Error(string(message.error.message).slice(0, 1200) || 'Desktop could not complete the request.'));
      else pending.resolve(message.result);
      return;
    }
    if (hostOrigin === null) return;
    if (message.method === 'ui/notifications/host-context-changed') { theme(message.params); composerContext(message.params); renderComposer(); }
    if (message.method === 'ui/notifications/tool-result') {
      try {
        const data = mcpData(message.params);
        if (Array.isArray(data.chats) && data.application === 'codex') {
          if (!initialLoad && !state.ready) receiveInitialPanel(data);
          applyPanel(data);
        }
        else if (typeof data.session_id === 'string' && Array.isArray(data.messages)) applyHistory(data.session_id, data, false);
      } catch (error) { showConnectionError(error.message); }
    }
  });
  function showConnectionError(text) { state.panelError = text; $('connection-error').textContent = text; $('connection-error').hidden = !text; }
  function history(sessionId) {
    if (!state.histories.has(sessionId)) state.histories.set(sessionId, { messages: [], loaded: false, loading: false, nextCursor: null, hasMore: false, paged: false, error: '', warning: '' });
    return state.histories.get(sessionId);
  }
  function applyPanel(data) {
    if (data.application !== 'codex' || typeof data.owner_thread_id !== 'string') throw new Error('This panel is available in a local Codex chat with a verified sender.');
    composerContext(data);
    if (state.owner && state.owner !== data.owner_thread_id) {
      state.ready = false; renderComposer();
      throw new Error('The Codex context changed. Reopen the panel in the intended chat.');
    }
    state.owner = data.owner_thread_id;
    state.chats = data.chats.filter(chat => object(chat) && typeof chat.session_id === 'string' && chat.session_id)
